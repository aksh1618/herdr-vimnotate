id = "aksh1618.vimnotate"
name = "Vimnotate"
version = "0.3.0"
description = "Quote-reply annotate the focused pane's thread in nvim, in the pane's own slot"
min_herdr_version = "0.9.0"
platforms = ["linux", "macos"]

[[actions]]
id = "open"
title = "Vimnotate thread"
description = "Open the focused pane's scrollback in nvim for quote-reply annotation"
contexts = ["pane", "selection"]
command = ["./open.sh"]

[[panes]]
id = "vimnotate"
title = "vimnotate"
placement = "tab"
command = ["./herdr-vimnotate.sh"]
