id = "aksh1618.vimnotate"
name = "Vimnotate"
version = "0.8.0"
description = "Annotate the focused pane's thread in nvim (comment, delete, looks good) and send it to the agent, in the pane's own slot"
min_herdr_version = "0.9.0"
platforms = ["linux", "macos"]

[[actions]]
id = "open"
title = "Vimnotate thread"
description = "Open the focused pane's scrollback in nvim to annotate and send back"
contexts = ["pane", "selection"]
command = ["./open.sh"]

[[panes]]
id = "vimnotate"
title = "vimnotate"
placement = "tab"
command = ["./herdr-vimnotate.sh"]
