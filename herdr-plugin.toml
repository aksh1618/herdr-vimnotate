id = "aksh1618.annotate-thread"
name = "Annotate Thread"
version = "0.1.0"
description = "Quote-reply annotate the focused pane's thread in nvim"
min_herdr_version = "0.7.5"
platforms = ["linux", "macos"]

[[actions]]
id = "open"
title = "Annotate thread"
description = "Open the focused pane's scrollback in nvim for quote-reply annotation"
contexts = ["pane"]
command = ["./open.sh"]

[[panes]]
id = "annotate"
title = "annotate"
placement = "popup"
width = "100%"
height = "100%"
command = ["./herdr-annotate-thread.sh"]
